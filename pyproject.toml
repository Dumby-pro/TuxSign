[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tuxsign"
version = "0.1.0"
description = "Build, package, sign and install iOS apps (SwiftUI or HTML) from Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cryptography>=41"]

[project.scripts]
tuxsign = "tuxsign.cli:main"

[tool.setuptools.packages.find]
include = ["tuxsign*"]

[tool.setuptools.package-data]
tuxsign = ["templates/**/*", "shell/**/*"]
